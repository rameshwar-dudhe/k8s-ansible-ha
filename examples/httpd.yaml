---
# ============================================================================
#  Demo workload: Apache httpd, 2 replicas, ClusterIP + NodePort.
#
#    kubectl apply -f examples/httpd.yaml
#    kubectl delete -f examples/httpd.yaml
#
#  NOTE ON TOLERATIONS: this cluster keeps the control-plane NoSchedule taint
#  (remove_control_plane_taint: false), so with no workers joined yet an
#  ordinary Deployment stays Pending forever. The toleration below lets the
#  demo run on the control plane. Real workloads should NOT carry it -- add a
#  worker with add-worker.yml instead.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-content
  labels: {app: httpd}
data:
  index.html: |
    <!doctype html>
    <title>httpd on k8s-ansible-ha</title>
    <h1>httpd is serving from Kubernetes</h1>
    <p>Served by pod: __POD_NAME__</p>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd
  labels: {app: httpd}
spec:
  replicas: 2
  selector:
    matchLabels: {app: httpd}
  template:
    metadata:
      labels: {app: httpd}
    spec:
      # See note at the top of this file.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Spread replicas across nodes once workers exist.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: httpd}
      volumes:
        - name: content
          emptyDir: {}
        - name: seed
          configMap: {name: httpd-content}
      initContainers:
        # Stamp the pod name into the page so we can prove which replica
        # answered a given request when we test load balancing.
        - name: render
          image: busybox:1.36
          command:
            - sh
            - -c
            - sed "s/__POD_NAME__/$POD_NAME/" /seed/index.html > /usr/local/apache2/htdocs/index.html
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          volumeMounts:
            - {name: seed, mountPath: /seed}
            - {name: content, mountPath: /usr/local/apache2/htdocs}
      containers:
        - name: httpd
          image: httpd:2.4-alpine
          ports:
            - {name: http, containerPort: 80}
          volumeMounts:
            - {name: content, mountPath: /usr/local/apache2/htdocs}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}

---
apiVersion: v1
kind: Service
metadata:
  name: httpd
  labels: {app: httpd}
spec:
  type: ClusterIP
  selector: {app: httpd}
  ports:
    - {name: http, port: 80, targetPort: http}

---
apiVersion: v1
kind: Service
metadata:
  name: httpd-nodeport
  labels: {app: httpd}
spec:
  type: NodePort
  selector: {app: httpd}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
