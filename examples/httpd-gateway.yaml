# ============================================================================
#  Gateway API demo — Apache httpd exposed through a Cilium Gateway.
#
#    kubectl apply -f examples/httpd-gateway.yaml
#    # from anywhere that can reach the cluster network:
#    curl -H 'Host: httpd.k8s-ha.lab' http://192.168.56.100/
#
#    kubectl delete -f examples/httpd-gateway.yaml
#
#  gateway_api_expose is "hostNetwork", so the cilium GatewayClass binds this
#  listener on port 80 of every node's host network — the kube-vip VIP
#  (192.168.56.100) fronts it, no LoadBalancer required.
#
#  This cluster keeps the control-plane NoSchedule taint, so the Deployment
#  carries a toleration to run on the lone control plane. Drop it once a
#  worker has joined and you want httpd off the control plane.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-content
  namespace: default
  labels: {app: httpd}
data:
  index.html: |
    <!doctype html>
    <title>httpd via Gateway API</title>
    <h1>httpd is serving through a Cilium Gateway</h1>
    <p>Served by pod: __POD_NAME__</p>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd
  namespace: default
  labels: {app: httpd}
spec:
  replicas: 2
  selector:
    matchLabels: {app: httpd}
  template:
    metadata:
      labels: {app: httpd}
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: httpd}
      volumes:
        - name: content
          emptyDir: {}
        - name: seed
          configMap: {name: httpd-content}
      initContainers:
        # Stamp the pod name into the page so a response proves which replica
        # answered — useful when checking Gateway load balancing.
        - name: render
          image: busybox:1.36
          command:
            - sh
            - -c
            - sed "s/__POD_NAME__/$POD_NAME/" /seed/index.html > /usr/local/apache2/htdocs/index.html
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          volumeMounts:
            - {name: seed, mountPath: /seed}
            - {name: content, mountPath: /usr/local/apache2/htdocs}
      containers:
        - name: httpd
          image: httpd:2.4-alpine
          ports:
            - {name: http, containerPort: 80}
          volumeMounts:
            - {name: content, mountPath: /usr/local/apache2/htdocs}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}

---
apiVersion: v1
kind: Service
metadata:
  name: httpd
  namespace: default
  labels: {app: httpd}
spec:
  type: ClusterIP
  selector: {app: httpd}
  ports:
    - {name: http, port: 80, targetPort: http}

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: httpd
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpd
  namespace: default
spec:
  parentRefs:
    - name: httpd
  hostnames:
    - "httpd.k8s-ha.lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpd
          port: 80
