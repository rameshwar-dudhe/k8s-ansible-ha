[defaults]
inventory             = inventory/hosts.yml
roles_path            = roles
host_key_checking     = False
retry_files_enabled   = False
interpreter_python    = auto_silent
# NOTE: `stdout_callback = yaml` (community.general.yaml) was REMOVED in
# community.general 12 / ansible-core 2.20. The supported equivalent is the
# built-in default callback with result_format=yaml. Keeping this repo on
# ansible-core only, with no Galaxy collections required.
stdout_callback       = default
result_format         = yaml
forks                 = 10
timeout               = 30
display_skipped_hosts = False
any_errors_fatal      = True

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30
