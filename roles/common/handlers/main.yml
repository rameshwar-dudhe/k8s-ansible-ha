---
- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: reload networkmanager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded
  failed_when: false

- name: reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
