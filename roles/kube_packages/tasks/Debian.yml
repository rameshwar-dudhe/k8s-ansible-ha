---
- name: packages | Debian | Create the keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: packages | Debian | Fetch the Kubernetes signing key
  ansible.builtin.get_url:
    url: "{{ _k8s_base }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: "0644"
    force: true

- name: packages | Debian | Dearmor the signing key
  ansible.builtin.shell:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /tmp/kubernetes-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: packages | Debian | Add the Kubernetes repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ _k8s_base }}/deb/ /"
    filename: kubernetes
    state: present
    update_cache: true

- name: packages | Debian | Release the apt hold before changing versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: [kubelet, kubeadm, kubectl]
  failed_when: false

- name: packages | Debian | Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name: >-
      {{ ['kubelet', 'kubeadm', 'kubectl']
         | map('regex_replace', '$', '=' ~ k8s_patch ~ '-' ~ k8s_deb_revision)
         | list
         if k8s_patch | length > 0
         else ['kubelet', 'kubeadm', 'kubectl'] }}
    state: present
    allow_change_held_packages: true
    update_cache: true

# crictl (cri-tools) is published ONLY in the pkgs.k8s.io repo added above.
# The CRI-O repo does not carry it, and kubeadm's 1.37 package has no
# dependencies, so nothing pulls it in. It used to be installed by the
# container_runtime role, which runs BEFORE this repo exists: on a fresh node
# apt found no candidate, `failed_when: false` hid that, and crictl was missing.
# Install it here, after the repo, and let a failure fail.
- name: packages | Debian | Install cri-tools (crictl)
  ansible.builtin.apt:
    name: cri-tools
    state: present

- name: packages | Debian | Hold the packages at the installed version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]
