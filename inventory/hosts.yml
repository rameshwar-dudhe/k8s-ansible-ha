---
# ============================================================================
#  k8s-ansible-ha inventory
# ============================================================================
#  ONLY 192.168.56.134 is ACTIVE. Everything else is commented out.
#
#  192.168.56.133 MUST NEVER appear in this file. The `safety` role runs as
#  the first task of every playbook and hard-aborts the run if any forbidden
#  address shows up in the inventory, in the play, or as an IP actually owned
#  by a target machine.
#
#  ── To bring a node in ──────────────────────────────────────────────────
#   1. uncomment its block below
#   2. make sure its IP is in `allowed_hosts` (inventory/group_vars/all.yml)
#      — .134 to .141 are pre-approved
#   3. passwordless SSH from this control node must already work
#   4. run:  ansible-playbook playbooks/add-worker.yml  -e cni=cilium
#        or: ansible-playbook playbooks/add-master.yml  -e cni=cilium
#      (pass the SAME -e cri=/-e cni= flags the cluster was BUILT with)
#
#  ── ADDRESSING WARNING ──────────────────────────────────────────────────
#  Nodes here use .134-.141, which sit INSIDE the VMware NAT DHCP pool
#  (.128-.254). The DHCP-free range on this network is .3-.127 (.100 is the
#  kube-vip VIP), but the addresses were kept as-is by choice.
#
#  Know the failure mode this exposes. cp-0 is pinned to .134, inside the pool.
#  While it was rebooting, the DHCP server handed .134 to another VM; on boot
#  NetworkManager ARP-probed the address, found it taken, and failed the entire
#  connection ('ip-config-unavailable') — so the NIC came up with NO address at
#  all, not a wrong one. A static address removes DHCP's ability to negotiate;
#  it does not reserve anything.
#
#  The mitigation is on the VMware HOST, not here: reserve or exclude .134-.141
#  in /etc/vmware/vmnet*/dhcpd/dhcpd.conf (Linux host), then
#  `vmware-networks --stop && vmware-networks --start`. Until that is done, any
#  node that is powered off can have its address leased away underneath it.
#
#  Pin a node's address BEFORE the cluster is built — the IP is baked into cert
#  SANs, etcd peer URLs and kubelet --node-ip at kubeadm time, so changing it
#  later means a rebuild:
#      ansible-playbook playbooks/set-static-ip.yml -e static_ip_enabled=true
#  The role ARP-probes the target address first and refuses on a conflict.
# ============================================================================

all:
  vars:
    ansible_user: root
    ansible_connection: ssh
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

  # Declared explicitly rather than relying on the IMPLICIT localhost, which
  # does not inherit group_vars/all -- destroy-cluster.yml runs local plays
  # that need artifacts_dir and cluster_name.
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  children:

    k8s_cluster:
      children:

        # ═══════════════════════════ CONTROL PLANE ═══════════════════════
        masters:
          children:

            # ---- The FIRST control plane. `kubeadm init` runs here. ------
            #      Exactly one host. Never comment this out.
            master_primary:
              hosts:
                k8s-cp-0:
                  ansible_host: 192.168.56.134
                  node_ip: 192.168.56.134

            # ---- Additional control planes. Added by add-master.yml. -----
            #
            #  !! KEEP THE TOTAL NUMBER OF CONTROL PLANES ODD !!
            #
            #  etcd quorum is (n/2)+1, so failures tolerated are:
            #      1 master  -> 0      (no HA)
            #      2 masters -> 0      (worse than 1: two ways to fail)
            #      3 masters -> 1      <-- recommended
            #      4 masters -> 1      (no better than 3, one more thing to break)
            #      5 masters -> 2
            #
            #  So uncomment k8s-cp-1 and k8s-cp-2 for real HA (3 total) and
            #  leave k8s-cp-3 alone unless you are going all the way to 5.
            #  add-master.yml warns you when the count goes even.
            #
            #  Join them ONE AT A TIME — the playbook already runs serial: 1,
            #  because concurrent etcd member additions can lose quorum.
            master_secondary:
              hosts: {}
              # NOTE: .135 is NOT free — it is k8s-w-0 (see the workers group).
              # k8s-cp-1:                        # -> 2 masters: NOT HA, avoid stopping here
              #   ansible_host: 192.168.56.136
              #   node_ip: 192.168.56.136
              # k8s-cp-2:                        # -> 3 masters: recommended HA
              #   ansible_host: 192.168.56.137
              #   node_ip: 192.168.56.137
              # k8s-cp-3:                        # -> 4 masters: even, no gain over 3
              #   ansible_host: 192.168.56.138
              #   node_ip: 192.168.56.138

        # ═══════════════════════════════ WORKERS ═════════════════════════
        #  Added by add-worker.yml. Any count is fine — no quorum concerns.
        #  These join in parallel by default; use -e worker_batch_size=1 to
        #  roll them in one at a time.
        #
        #  Adding even one worker means your own workloads no longer need a
        #  control-plane toleration to schedule.
        workers:
          hosts:
            # The VM whose OS hostname still reads k8s-cp-1. It is a WORKER:
            # `common` renames the host and `join_worker` passes
            # --node-name k8s-w-0, so the cluster only ever sees k8s-w-0.
            # The VM whose OS hostname still reads k8s-cp-1. It is a WORKER:
            # `common` renames the host and `join_worker` passes
            # --node-name k8s-w-0, so the cluster only ever sees k8s-w-0.
            # It sits on .135, the slot the template used to pencil in for cp-1.
            k8s-w-0:
              ansible_host: 192.168.56.135
              node_ip: 192.168.56.135
          # k8s-w-1:
          #   ansible_host: 192.168.56.139
          #   node_ip: 192.168.56.139
          # k8s-w-2:
          #   ansible_host: 192.168.56.140
          #   node_ip: 192.168.56.140
          # k8s-w-3:
          #   ansible_host: 192.168.56.141
          #   node_ip: 192.168.56.141
