---
# ============================================================================
#  Joins additional control planes to an existing cluster.
#
#  Add the node to the `master_secondary` group in inventory/hosts.yml first,
#  then:
#    ansible-playbook playbooks/add-master.yml
#    ansible-playbook playbooks/add-master.yml --limit k8s-cp-1
#
#  Keep the total number of control planes ODD (1, 3, 5) — etcd quorum is
#  (n/2)+1, so 2 control planes tolerate no failures at all.
# ============================================================================

- name: Import — safety guard (runs first, before any remote connection)
  ansible.builtin.import_playbook: guard.yml

- name: Join additional control planes
  hosts: master_secondary
  gather_facts: true
  any_errors_fatal: true
  # One at a time: concurrent etcd member additions can lose quorum.
  serial: 1

  pre_tasks:
    - name: Enforce the host guard rails
      ansible.builtin.import_role:
        name: safety

    # An empty `master_secondary` group means this play matches no hosts and is
    # skipped entirely, so there is nothing to guard against here.
    - name: Confirm the primary control plane is initialised
      delegate_to: "{{ groups['master_primary'][0] }}"
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: _primary_ready

    - name: Refuse to join a cluster that does not exist
      ansible.builtin.assert:
        that:
          - _primary_ready.stat.exists
        fail_msg: >-
          {{ groups['master_primary'][0] }} has no /etc/kubernetes/admin.conf —
          the cluster has not been initialised. Run init-master.yml first.
        quiet: true

  roles:
    - role: common
    - role: container_runtime
    - role: kube_packages
    - role: join_control_plane
