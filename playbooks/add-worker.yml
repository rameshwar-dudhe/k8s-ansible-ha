---
# ============================================================================
#  Joins worker nodes to an existing cluster.
#
#  Add the node to the `workers` group in inventory/hosts.yml first, then:
#    ansible-playbook playbooks/add-worker.yml
#    ansible-playbook playbooks/add-worker.yml --limit k8s-w-0
# ============================================================================

- name: Import — safety guard (runs first, before any remote connection)
  ansible.builtin.import_playbook: guard.yml

- name: Join worker nodes
  hosts: workers
  gather_facts: true
  any_errors_fatal: false   # one bad worker should not abort the others
  serial: "{{ worker_batch_size | default('100%') }}"

  pre_tasks:
    - name: Enforce the host guard rails
      ansible.builtin.import_role:
        name: safety

    # An empty `workers` group means this play matches no hosts and is skipped
    # entirely, so there is nothing to guard against here.
    - name: Confirm the primary control plane is initialised
      delegate_to: "{{ groups['master_primary'][0] }}"
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: _primary_ready

    - name: Refuse to join a cluster that does not exist
      ansible.builtin.assert:
        that:
          - _primary_ready.stat.exists
        fail_msg: >-
          {{ groups['master_primary'][0] }} has no /etc/kubernetes/admin.conf —
          the cluster has not been initialised. Run init-master.yml first.
        quiet: true

  roles:
    - role: common
    - role: container_runtime
    - role: kube_packages
    - role: join_worker
