---
# ============================================================================
#  DESTRUCTIVE. Tears the cluster down and wipes all state.
#
#  Refuses to run without an explicit confirmation flag:
#    ansible-playbook playbooks/destroy-cluster.yml -e confirm_destroy=yes
#
#  That alone is a FULL cleanup by default: packages (kubelet/kubeadm/kubectl),
#  the container runtime and its whole data store (containers, sandboxes,
#  cached images) are all removed — nodes end up as if they never ran
#  Kubernetes. No extra flag needed.
#
#  To keep packages installed instead, for a faster next rebuild:
#    ansible-playbook playbooks/destroy-cluster.yml -e confirm_destroy=yes \
#                                                   -e reset_purge_packages=false
#
#  Teardown order is the reverse of build order: workers first, then secondary
#  control planes, then the primary. Draining a node after its API server has
#  gone is impossible, so the primary must be last.
# ============================================================================

- name: Import — safety guard (runs first, before any remote connection)
  ansible.builtin.import_playbook: guard.yml

- name: Confirm intent
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Require an explicit confirmation
      ansible.builtin.assert:
        that:
          - (confirm_destroy | default('')) | string | lower in ['yes', 'true']
        fail_msg: |
          Refusing to destroy the cluster without confirmation.
          Re-run with:  -e confirm_destroy=yes
        success_msg: "Confirmed — tearing down '{{ cluster_name }}'."
        quiet: true

    - name: State what is about to happen
      ansible.builtin.debug:
        msg:
          - "About to RESET these nodes:"
          - "  workers          : {{ groups['workers'] | default([]) | join(', ') | default('none', true) }}"
          - "  extra masters    : {{ groups['master_secondary'] | default([]) | join(', ') | default('none', true) }}"
          - "  primary master   : {{ groups['master_primary'] | default([]) | join(', ') | default('none', true) }}"
          - "  purge packages   : {{ reset_purge_packages | default(true) }}"
          - "NEVER touched      : {{ forbidden_hosts | join(', ') }}"

# ─────────────────────────── 1. Drain what we can ──────────────────────────
- name: Cordon and drain nodes while the API server still exists
  hosts: master_primary
  gather_facts: true
  tasks:
    - name: Enforce the host guard rails
      ansible.builtin.import_role:
        name: safety

    - name: Check the API server is still reachable
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o name
      register: _api
      changed_when: false
      failed_when: false

    - name: Drain every node
      when: _api.rc == 0
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf drain {{ item | replace('node/', '') }}
        --ignore-daemonsets --delete-emptydir-data --force --timeout=120s
      loop: "{{ _api.stdout_lines | default([]) }}"
      changed_when: true
      failed_when: false

    - name: Note when the API server is already gone
      when: _api.rc != 0
      ansible.builtin.debug:
        msg: "API server unreachable — skipping drain and going straight to reset."

# ─────────────────────────── 2. Reset, in order ────────────────────────────
- name: Reset workers
  hosts: workers
  gather_facts: true
  any_errors_fatal: false
  tasks:
    - name: Enforce the host guard rails
      ansible.builtin.import_role:
        name: safety
    - name: Reset the node
      ansible.builtin.import_role:
        name: reset

- name: Reset secondary control planes
  hosts: master_secondary
  gather_facts: true
  any_errors_fatal: false
  serial: 1
  tasks:
    - name: Enforce the host guard rails
      ansible.builtin.import_role:
        name: safety
    - name: Reset the node
      ansible.builtin.import_role:
        name: reset

- name: Reset the primary control plane
  hosts: master_primary
  gather_facts: true
  any_errors_fatal: false
  tasks:
    - name: Enforce the host guard rails
      ansible.builtin.import_role:
        name: safety
    - name: Reset the node
      ansible.builtin.import_role:
        name: reset

# ─────────────────────────── 3. Clean up locally ───────────────────────────
- name: Clean up control-node artifacts
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Remove the stored kubeconfig and join commands
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ artifacts_dir }}/admin.conf"
        - "{{ artifacts_dir }}/join-commands.sh"

    # ─────── ~/.kube/config installed by create-cluster.yml for local users ───────
    # The cluster CA is gone, so a kubeconfig pointing at this cluster is dead
    # weight: kubectl/k9s would only fail with x509 or connection errors. Remove it,
    # but ONLY when the file holds exactly one cluster AND that cluster's server is
    # this cluster's endpoint. A kubeconfig that also carries other clusters, or
    # points somewhere else, is left untouched and reported. Backups
    # (config.bak-*, config.*~) are never touched.
    #
    # Under ansible-navigator, "localhost" is the execution-environment container,
    # which cannot see the host's home directories. Skip there with a message.
    - name: Detect whether Ansible runs inside a container (ansible-navigator EE)
      ansible.builtin.stat:
        path: /.dockerenv
      register: _local_dockerenv

    - name: Decide whether local kubeconfigs can be cleaned up
      ansible.builtin.set_fact:
        _kubeconfig_in_container: >-
          {{ _local_dockerenv.stat.exists
             or (lookup('ansible.builtin.env', 'container') | length > 0) }}
        _kubeconfig_this_server: "https://{{ control_plane_endpoint }}:{{ control_plane_port }}"

    - name: Remove local kubeconfigs that point at this cluster
      when:
        - kubeconfig_local_users | default([]) | length > 0
        - not (_kubeconfig_in_container | bool)
      block:
        # Read-only lookup, so let it run under --check too. getent exits 2 when
        # the user does not exist; that is a skip, not a failure.
        - name: Look up each local user's home directory
          ansible.builtin.command: getent passwd {{ item }}
          loop: "{{ kubeconfig_local_users }}"
          register: _kubeconfig_passwd
          changed_when: false
          failed_when: _kubeconfig_passwd.rc not in [0, 2]
          check_mode: false

        - name: Check which users have a ~/.kube/config
          ansible.builtin.stat:
            path: "{{ item.stdout.split(':')[5] }}/.kube/config"
          loop: "{{ _kubeconfig_passwd.results | selectattr('rc', 'equalto', 0) | list }}"
          loop_control:
            label: "{{ item.item }}"
          register: _kubeconfig_stat

        - name: Read the existing kubeconfigs
          ansible.builtin.slurp:
            src: "{{ item.stat.path }}"
          loop: "{{ _kubeconfig_stat.results | selectattr('stat.exists') | list }}"
          loop_control:
            label: "{{ item.item.item }}"
          register: _kubeconfig_content

        - name: Start with empty remove / keep lists
          ansible.builtin.set_fact:
            _kubeconfig_remove: []
            _kubeconfig_keep: []

        # A kubeconfig is removable only when it holds exactly one cluster and
        # that cluster's server is this cluster's endpoint. Everything else is kept.
        - name: Sort each kubeconfig into remove or keep
          vars:
            _clusters: "{{ (item.content | b64decode | from_yaml).clusters | default([]) }}"
            _removable: >-
              {{ (_clusters | length == 1)
                 and ((_clusters[0].cluster.server | default('')) == _kubeconfig_this_server) }}
          ansible.builtin.set_fact:
            _kubeconfig_remove: "{{ _kubeconfig_remove + ([item.source] if _removable | bool else []) }}"
            _kubeconfig_keep: "{{ _kubeconfig_keep + ([] if _removable | bool else [item.source]) }}"
          loop: "{{ _kubeconfig_content.results }}"
          loop_control:
            label: "{{ item.source }}"

        - name: Delete kubeconfigs that only point at the destroyed cluster
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ _kubeconfig_remove }}"

        - name: Report kubeconfigs that were kept
          when: _kubeconfig_keep | length > 0
          ansible.builtin.debug:
            msg: >-
              Kept (holds other clusters or does not point at {{ _kubeconfig_this_server }}):
              {{ _kubeconfig_keep | join(', ') }}

    - name: Explain why ~/.kube/config was not cleaned up
      when:
        - kubeconfig_local_users | default([]) | length > 0
        - _kubeconfig_in_container | bool
      ansible.builtin.debug:
        msg: >-
          Running inside a container (ansible-navigator execution environment), so
          ~/.kube/config on the host was NOT removed. If it points at this cluster,
          delete it on the host: rm ~/.kube/config

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Cluster '{{ cluster_name }}' destroyed. Nodes are back to
          {{ 'a bare OS' if (reset_purge_packages | default(true) | bool)
             else 'packages-installed-but-no-cluster' }}.
